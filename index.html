<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 專屬伴侶">
  <title>AI 專屬伴侶</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif;
      background-color: #8cabd9;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* 頂部導覽列（支援 iPhone 動態島安全距離） */
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: 12px;
      padding-left: 16px;
      padding-right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      z-index: 10;
    }
    .char-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; color: #111; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #e1e8f0; display: flex; align-items: center; justify-content: center;
      font-size: 20px; overflow: hidden; flex-shrink: 0;
    }
    .header-btns { display: flex; gap: 8px; }
    .icon-btn {
      background: #f0f2f5; border: none; padding: 7px 12px; border-radius: 16px;
      font-size: 13px; color: #333; cursor: pointer; font-weight: 500;
    }
    /* 聊天訊息區 */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.model { align-self: flex-start; }
    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .msg-row.user .bubble { background: #06c755; color: #fff; border-bottom-right-radius: 4px; }
    .msg-row.model .bubble { background: #ffffff; color: #111; border-bottom-left-radius: 4px; }
    /* 底部輸入列（支援 iPhone 底部安全距離） */
    .input-area {
      background: #fff;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      align-items: center;
      border-top: 1px solid rgba(0,0,0,0.08);
    }
    #user-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 16px; /* 16px 可防止 iOS Safari 點擊輸入框時自動放大畫面 */
      outline: none;
      background: #f7f8fa;
    }
    #send-btn {
      background: #06c755; color: white; border: none;
      border-radius: 20px; padding: 10px 16px; font-size: 15px; font-weight: 600;
      cursor: pointer; flex-shrink: 0;
    }
    #send-btn:disabled { background: #a5d8b8; }
    /* 設定視窗 */
    #settings-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-content {
      background: #fff; width: 100%; max-width: 420px; border-radius: 16px;
      padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto;
    }
    .modal-content h3 { font-size: 18px; margin-bottom: 4px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 13px; color: #555; font-weight: 600; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
    }
    .field textarea { height: 110px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="char-info">
      <div class="avatar" id="header-avatar">🐱</div>
      <span id="header-name">專屬角色</span>
    </div>
    <div class="header-btns">
      <button class="icon-btn" onclick="clearChat()">清除對話</button>
      <button class="icon-btn" onclick="openSettings()">⚙️ 設定</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="輸入訊息..." autocomplete="off">
    <button id="send-btn" onclick="sendMessage()">傳送</button>
  </div>

  <!-- 設定彈窗 -->
  <div id="settings-modal">
    <div class="modal-content">
      <h3>⚙️ 角色與 API 設定</h3>
      <div class="field">
        <label>Gemini API Key（必填）</label>
        <input type="password" id="api-key" placeholder="貼上 AIza 開頭的金鑰">
      </div>
      <div class="field">
        <label>Gemini 模型版本</label>
        <select id="model-name">
          <option value="gemini-3.8-flash">gemini-3.8-flash（最新推薦）</option>
          <option value="gemini-3.5-flash">gemini-3.5-flash（穩定流暢）</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite（極速省額度）</option>
          <option value="gemini-flash-latest">gemini-flash-latest（自動最新）</option>
        </select>
      </div>
      <div class="field">
        <label>角色名稱</label>
        <input type="text" id="char-name" placeholder="例如：傲嬌青梅竹馬">
      </div>
      <div class="field">
        <label>角色頭像（輸入一個 Emoji）</label>
        <input type="text" id="char-avatar" placeholder="例如：🦊 或 👧">
      </div>
      <div class="field">
        <label>角色人設與背景（System Prompt）</label>
        <textarea id="sys-prompt" placeholder="請描述角色的性格、說話口吻、與你的關係..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="icon-btn" onclick="closeSettings()">取消</button>
        <button class="icon-btn" style="background:#06c755;color:#fff;" onclick="saveSettings()">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    let chatHistory = JSON.parse(localStorage.getItem('rp_history') || '[]');
    let config = JSON.parse(localStorage.getItem('rp_config') || JSON.stringify({
      apiKey: '',
      model: 'gemini-3.8-flash',
      name: '小希',
      avatar: '🐱',
      systemPrompt: '你現在扮演我的青梅竹馬「小希」，性格溫柔帶點調皮，說話自然口語化，像在傳 LINE 一樣簡短自然，絕對不要承認自己是 AI。'
    }));

    function initApp() {
      document.getElementById('header-name').textContent = config.name;
      document.getElementById('header-avatar').textContent = config.avatar;
      renderMessages();
      if (!config.apiKey) openSettings();
    }

    function renderMessages() {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      chatHistory.forEach(item => {
        const row = document.createElement('div');
        row.className = `msg-row ${item.role}`;
        if (item.role === 'model') {
          const av = document.createElement('div');
          av.className = 'avatar';
          av.textContent = config.avatar;
          row.appendChild(av);
        }
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = item.parts[0].text;
        row.appendChild(bubble);
        box.appendChild(row);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const btn = document.getElementById('send-btn');
      const text = input.value.trim();
      if (!text) return;
      if (!config.apiKey) { alert('請先點選右上角「設定」填入 Gemini API Key！'); openSettings(); return; }

      input.value = '';
      chatHistory.push({ role: 'user', parts: [{ text }] });
      localStorage.setItem('rp_history', JSON.stringify(chatHistory));
      renderMessages();
      btn.disabled = true;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: config.systemPrompt }] },
            contents: chatHistory
          })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '（角色沒有回應）';
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        localStorage.setItem('rp_history', JSON.stringify(chatHistory));
        renderMessages();
      } catch (err) {
        alert('發送失敗：' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('user-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function openSettings() {
      document.getElementById('api-key').value = config.apiKey;
      document.getElementById('model-name').value = config.model;
      document.getElementById('char-name').value = config.name;
      document.getElementById('char-avatar').value = config.avatar;
      document.getElementById('sys-prompt').value = config.systemPrompt;
      document.getElementById('settings-modal').style.display = 'flex';
    }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    function saveSettings() {
      config.apiKey = document.getElementById('api-key').value.trim();
      config.model = document.getElementById('model-name').value;
      config.name = document.getElementById('char-name').value.trim() || '專屬角色';
      config.avatar = document.getElementById('char-avatar').value.trim() || '🐱';
      config.systemPrompt = document.getElementById('sys-prompt').value.trim();
      localStorage.setItem('rp_config', JSON.stringify(config));
      initApp();
      closeSettings();
    }
    function clearChat() {
      if (confirm('確定要清除所有對話紀錄嗎？')) {
        chatHistory = [];
        localStorage.removeItem('rp_history');
        renderMessages();
      }
    }

    initApp();
  </script>
</body>
</html>
